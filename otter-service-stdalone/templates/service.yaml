apiVersion: v1
kind: Service
metadata:
  name: {{ include "otter-service-stdalone.fullname" . }}
  labels:
    {{- include "otter-service-stdalone.labels" . | nindent 4 }}
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-port: "80"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-path: "/otterhealth"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-check-interval-seconds: "15"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-response-timeout-seconds: "15"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-unhealthy-threshold: "2"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-healthy-threshold: "1"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  loadBalancerIP: {{ .Values.service.load_balancer_ip }}
  selector:
    {{- include "otter-service-stdalone.selectorLabels" . | nindent 4 }}
